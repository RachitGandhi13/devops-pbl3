apiVersion: apps/v1
kind: Deployment
metadata:
  name: healthcare-api
  namespace: healthcare
spec:
  replicas: 2
  selector:
    matchLabels: { app: healthcare-api }
  template:
    metadata:
      labels: { app: healthcare-api }
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
      containers:
        - name: api
          image: IMAGE_PLACEHOLDER
          ports:
            - containerPort: 3000
          env:
            - name: API_KEY
              valueFrom:
                secretKeyRef: { name: healthcare-secret, key: API_KEY }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits: { cpu: 250m, memory: 128Mi }
          readinessProbe:
            httpGet: { path: /health, port: 3000 }
---
apiVersion: v1
kind: Service
metadata:
  name: healthcare-svc
  namespace: healthcare
spec:
  type: NodePort
  selector: { app: healthcare-api }
  ports:
    - port: 80
      targetPort: 3000
      nodePort: 30100
